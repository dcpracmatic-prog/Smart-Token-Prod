[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-token-prod"
version = "0.10.5"
description = "Token post-cuantico (ML-KEM + AES-256-GCM) con trampa logica persistente (fases 1-3) endurecida por Argon2id, nucleo C++ opcional y capa .stok; sk fuera de banda"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Elastic-2.0" }  # vigente: Elastic License 2.0 (ver LICENSE.txt)
authors = [
    { name = "Arturo Salvador Balderas Hernandez" }
]
dependencies = [
    "pqcrypto>=0.3",
    "cryptography>=41",
    "numpy>=1.24",
    "argon2-cffi>=23",
]

[project.urls]
Homepage = "https://github.com/dcpracmatic-prog/Smart-Token-Prod"
Repository = "https://github.com/dcpracmatic-prog/Smart-Token-Prod"
Documentation = "https://github.com/dcpracmatic-prog/Smart-Token-Prod/blob/main/docs/INTEGRATION.md"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]
redis = ["redis>=5"]

[project.scripts]
smart-token = "smart_token_prod.cli:main"

[tool.setuptools.packages.find]
include = ["smart_token_prod*"]

[tool.setuptools.package-data]
smart_token_prod = []

